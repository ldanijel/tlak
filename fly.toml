# Fly.io – vidi docs/UPUTE-Fly.io.docx i README. Naziv aplikacije mora biti jedinstven na Fly.io; `fly launch` će ga zatražiti.
app = "tlak-PROMIJENI-ME"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Pozivni kod postavlja se tajno: fly secrets set INVITE_CODE=vaš-kod
[env]
  PORT = "3000"
  DB_PATH = "/data/tlak.db"
  ALLOW_REGISTRATION = "true"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "tlak_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
